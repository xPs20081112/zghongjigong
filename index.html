<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刷题首页</title>
<style>
:root {
  --primary: #C3B3FF;
  --primary-dark: #8B7BD8;
  --panel-bg: #EDE7FF;
  --panel-border: #D0C4F0;
  --card-bg: #FFFFFF;
  --green: #4CAF50;
  --green-bg: #C8E6C9;
  --green-text: #1B5E20;
  --red: #F44336;
  --red-bg: #FFCDD2;
  --red-text: #B71C1C;
  --text: #2D2A3E;
  --text-light: #6B6680;
  --btn-bg: #8B7BD8;
  --btn-text: #FFFFFF;
  --btn-disabled-bg: #D8CCFF;
  --btn-disabled-text: #9B92B8;
  --page-bg: #C3B3FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--page-bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
}
button, textarea { font: inherit; }
.quiz-area {
  flex: 1;
  padding: 16px;
  max-width: 920px;
  margin: 0 auto;
  min-width: 0;
}
.question-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(100, 80, 180, 0.1);
  scroll-margin-top: 16px;
  transition: outline 0.2s;
}
.question-card.current {
  outline: 2px solid var(--primary-dark);
  outline-offset: 2px;
}
.question-header {
  font-size: 13px;
  color: var(--primary-dark);
  font-weight: 600;
  margin-bottom: 8px;
}
.question-stem {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.options.locked .option { pointer-events: none; }
.option {
  padding: 10px 14px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  font-size: 15px;
  color: var(--text);
  user-select: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.option:hover { background: #F5F1FF; }
.option.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green-text);
}
.option.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red-text);
}
.info-panel {
  width: 340px;
  height: 100vh;
  position: sticky;
  top: 0;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.panel-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.number-list-wrap {
  padding: 12px;
  border-bottom: 1px solid var(--panel-border);
  max-height: 40vh;
  overflow-y: auto;
}
.analysis-wrap {
  padding: 12px;
  flex: 1;
  overflow-y: auto;
  border-bottom: 1px solid var(--panel-border);
}
.section-title {
  font-size: 13px;
  color: var(--text-light);
  font-weight: 600;
  margin-bottom: 8px;
}
.number-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 6px;
}
.num-item {
  padding: 6px 4px;
  min-height: 34px;
  text-align: center;
  border-radius: 6px;
  background: #fff;
  border: 1px solid var(--panel-border);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}
.num-item:hover { background: #F5F1FF; }
.num-item.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green-text);
}
.num-item.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red-text);
}
.num-item.current {
  outline: 2px solid var(--primary-dark);
  outline-offset: 1px;
}
.analysis {
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.analysis:empty::before {
  content: "点击题号查看解析";
  color: var(--text-light);
  font-size: 13px;
}
.analysis .my-answer { font-weight: 600; margin-bottom: 6px; }
.analysis .my-answer.correct { color: var(--green-text); }
.analysis .my-answer.wrong { color: var(--red-text); }
.analysis .analysis-line { margin-bottom: 6px; }
.analysis .meta { color: var(--text-light); font-size: 13px; }
.nav-buttons {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--panel-border);
}
.progress-buttons {
  display: flex;
  gap: 6px;
  padding: 0 12px 12px;
}
.btn {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--btn-bg);
  color: var(--btn-text);
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  border: none;
  cursor: pointer;
  transition: filter 0.15s, opacity 0.15s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:hover { filter: brightness(1.08); }
.btn.disabled {
  background: var(--btn-disabled-bg);
  color: var(--btn-disabled-text);
  pointer-events: none;
  cursor: default;
}
.btn.small { padding: 7px 8px; font-size: 12px; }
.page-title {
  font-size: 14px;
  color: var(--primary-dark);
  font-weight: 700;
  margin-bottom: 10px;
}
.panel-bar { display: none; }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(40, 30, 80, 0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.show { display: flex; }
.modal-content {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 30px rgba(60, 45, 120, 0.22);
}
.modal-content h3 { margin-bottom: 12px; font-size: 16px; }
.modal-content textarea {
  width: 100%;
  min-height: 220px;
  padding: 8px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  resize: vertical;
  margin-bottom: 12px;
}
.modal-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-buttons .btn { min-width: 100px; }
.modal-note {
  color: var(--text-light);
  font-size: 12px;
  margin-bottom: 10px;
}

@media (max-width: 768px) {
  body { display: block; padding-bottom: 62px; }
  .quiz-area { padding: 12px; max-width: none; }
  .question-card { padding: 14px; }
  .question-stem { font-size: 15px; }
  .option { font-size: 14px; padding: 11px 12px; }
  .info-panel {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: auto;
    max-height: 78vh;
    border-left: none;
    border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 16px rgba(80, 60, 160, 0.15);
    z-index: 100;
  }
  .info-panel .panel-body { display: none; }
  .info-panel.expanded .panel-body {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: calc(78vh - 56px);
  }
  .info-panel .panel-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    min-height: 58px;
  }
  .info-panel.expanded .panel-bar {
    border-bottom: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
  }
  .toggle-btn {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 8px;
    background: var(--btn-bg);
    color: #fff;
    border: none;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .panel-bar .nav-buttons {
    flex: 1;
    padding: 0;
    border: none;
  }
  .panel-body .nav-buttons { display: none; }
  .number-list-wrap { max-height: none; overflow: visible; }
  .analysis-wrap { max-height: none; overflow: visible; flex: none; }
  .progress-buttons { padding-bottom: 14px; flex-wrap: wrap; }
  .progress-buttons .btn { flex: 1 1 30%; }
}

body { display: block; }
.index-wrap {
  width: min(100%, 920px);
  margin: 0 auto;
  padding: 20px 16px 36px;
}
.hero {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 2px 10px rgba(100, 80, 180, 0.12);
  margin-bottom: 16px;
}
.hero h1 { font-size: 24px; margin-bottom: 8px; }
.hero p { color: var(--text-light); font-size: 14px; }
.resume-btn { margin-top: 16px; width: 100%; min-height: 46px; }
.group {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(100, 80, 180, 0.08);
  margin-bottom: 14px;
}
.group h2 { font-size: 18px; margin-bottom: 12px; }
.page-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.page-link {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 8px 12px;
  background: #F5F1FF;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
}
.page-link:hover { background: #EEE7FF; }
.stats { margin-top: 12px; font-size: 13px; color: var(--text-light); }
@media (max-width: 520px) {
  .page-grid { grid-template-columns: 1fr; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
