<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择题 251-300</title>
<style>
:root {
  --primary: #C3B3FF;
  --primary-dark: #8B7BD8;
  --panel-bg: #EDE7FF;
  --panel-border: #D0C4F0;
  --card-bg: #FFFFFF;
  --green: #4CAF50;
  --green-bg: #C8E6C9;
  --green-text: #1B5E20;
  --red: #F44336;
  --red-bg: #FFCDD2;
  --red-text: #B71C1C;
  --text: #2D2A3E;
  --text-light: #6B6680;
  --btn-bg: #8B7BD8;
  --btn-text: #FFFFFF;
  --btn-disabled-bg: #D8CCFF;
  --btn-disabled-text: #9B92B8;
  --page-bg: #C3B3FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--page-bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
}
button, textarea { font: inherit; }
.quiz-area {
  flex: 1;
  padding: 16px;
  max-width: 920px;
  margin: 0 auto;
  min-width: 0;
}
.question-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(100, 80, 180, 0.1);
  scroll-margin-top: 16px;
  transition: outline 0.2s;
}
.question-card.current {
  outline: 2px solid var(--primary-dark);
  outline-offset: 2px;
}
.question-header {
  font-size: 13px;
  color: var(--primary-dark);
  font-weight: 600;
  margin-bottom: 8px;
}
.question-stem {
  font-size: 16px;
  color: var(--text);
  margin-bottom: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.options { display: flex; flex-direction: column; gap: 8px; }
.options.locked .option { pointer-events: none; }
.option {
  padding: 10px 14px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  font-size: 15px;
  color: var(--text);
  user-select: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.option:hover { background: #F5F1FF; }
.option.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green-text);
}
.option.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red-text);
}
.info-panel {
  width: 340px;
  height: 100vh;
  position: sticky;
  top: 0;
  background: var(--panel-bg);
  border-left: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.panel-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.number-list-wrap {
  padding: 12px;
  border-bottom: 1px solid var(--panel-border);
  max-height: 40vh;
  overflow-y: auto;
}
.analysis-wrap {
  padding: 12px;
  flex: 1;
  overflow-y: auto;
  border-bottom: 1px solid var(--panel-border);
}
.section-title {
  font-size: 13px;
  color: var(--text-light);
  font-weight: 600;
  margin-bottom: 8px;
}
.number-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
  gap: 6px;
}
.num-item {
  padding: 6px 4px;
  min-height: 34px;
  text-align: center;
  border-radius: 6px;
  background: #fff;
  border: 1px solid var(--panel-border);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}
.num-item:hover { background: #F5F1FF; }
.num-item.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green-text);
}
.num-item.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red-text);
}
.num-item.current {
  outline: 2px solid var(--primary-dark);
  outline-offset: 1px;
}
.analysis {
  font-size: 14px;
  color: var(--text);
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.analysis:empty::before {
  content: "点击题号查看解析";
  color: var(--text-light);
  font-size: 13px;
}
.analysis .my-answer { font-weight: 600; margin-bottom: 6px; }
.analysis .my-answer.correct { color: var(--green-text); }
.analysis .my-answer.wrong { color: var(--red-text); }
.analysis .analysis-line { margin-bottom: 6px; }
.analysis .meta { color: var(--text-light); font-size: 13px; }
.nav-buttons {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--panel-border);
}
.progress-buttons {
  display: flex;
  gap: 6px;
  padding: 0 12px 12px;
}
.btn {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--btn-bg);
  color: var(--btn-text);
  text-align: center;
  text-decoration: none;
  font-size: 14px;
  border: none;
  cursor: pointer;
  transition: filter 0.15s, opacity 0.15s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn:hover { filter: brightness(1.08); }
.btn.disabled {
  background: var(--btn-disabled-bg);
  color: var(--btn-disabled-text);
  pointer-events: none;
  cursor: default;
}
.btn.small { padding: 7px 8px; font-size: 12px; }
.page-title {
  font-size: 14px;
  color: var(--primary-dark);
  font-weight: 700;
  margin-bottom: 10px;
}
.panel-bar { display: none; }

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(40, 30, 80, 0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal.show { display: flex; }
.modal-content {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  width: 100%;
  max-width: 560px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 30px rgba(60, 45, 120, 0.22);
}
.modal-content h3 { margin-bottom: 12px; font-size: 16px; }
.modal-content textarea {
  width: 100%;
  min-height: 220px;
  padding: 8px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  resize: vertical;
  margin-bottom: 12px;
}
.modal-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.modal-buttons .btn { min-width: 100px; }
.modal-note {
  color: var(--text-light);
  font-size: 12px;
  margin-bottom: 10px;
}

@media (max-width: 768px) {
  body { display: block; padding-bottom: 62px; }
  .quiz-area { padding: 12px; max-width: none; }
  .question-card { padding: 14px; }
  .question-stem { font-size: 15px; }
  .option { font-size: 14px; padding: 11px 12px; }
  .info-panel {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: auto;
    max-height: 78vh;
    border-left: none;
    border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 16px rgba(80, 60, 160, 0.15);
    z-index: 100;
  }
  .info-panel .panel-body { display: none; }
  .info-panel.expanded .panel-body {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: calc(78vh - 56px);
  }
  .info-panel .panel-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    min-height: 58px;
  }
  .info-panel.expanded .panel-bar {
    border-bottom: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0;
  }
  .toggle-btn {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 8px;
    background: var(--btn-bg);
    color: #fff;
    border: none;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .panel-bar .nav-buttons {
    flex: 1;
    padding: 0;
    border: none;
  }
  .panel-body .nav-buttons { display: none; }
  .number-list-wrap { max-height: none; overflow: visible; }
  .analysis-wrap { max-height: none; overflow: visible; flex: none; }
  .progress-buttons { padding-bottom: 14px; flex-wrap: wrap; }
  .progress-buttons .btn { flex: 1 1 30%; }
}
</style>
</head>

<aside class="info-panel" id="infoPanel">
  <div class="panel-body">
    <div class="number-list-wrap">

      <div class="section-title">题号</div>
      <div class="number-list" id="numberList"></div>

</aside>

      <button class="btn" id="modalDownload" style="display:none">下载 JSON</button>

  </div>
</div>

:"choice-257","type":"choice","globalNumber":257,"stem":"使用链路状态算法的路由协议是 ()。","options":{"A":"RIP","B":"BGP","C":"OSPF","D":"PPP"},"answer":"C","analysis":"OSPF（开放最短路径优先）协议使用链路状态算法计算路由；RIP 使用距离向量算法；BGP 是边界网关协议，用于不同自治系统间的路由选择；PPP 是数据链路层协议，不是路由协议。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-258","type":"choice","globalNumber":258,"stem":"操作系统的安全威胁主要来自 ()。","options":{"A":"局域网","B":"内网","C":"外网","D":"内网和外网"},"answer":"C","analysis":"外网存在大量未知和不可控因素，如恶意软件、网络攻击等，是操作系统安全的主要威胁来源；虽然内网也可能存在安全风险，但相对外网威胁较小；局域网范围较广，概念不准确。所以选 C。","source":"未提供","difficulty":"中"},{"id":"choice-259","type":"choice","globalNumber":259,"stem":"存储保护的工作通常由 () 实现。","options":{"A":"软件","B":"硬件和软件配合","C":"硬件","D":"文件"},"answer":"B","analysis":"存储保护既需要硬件提供存储保护机制，如内存管理单元（MMU），也需要软件进行存储访问的控制和管理，两者配合才能实现存储保护功能。所以选 B。","source":"未提供","difficulty":"中"},{"id":"choice-260","type":"choice","globalNumber":260,"stem":"下面不属于本地用户组密码安全策略的内容是 ()。","options":{"A":"设定用户不能更改密码","B":"设定密码长度最小值","C":"密码必须符合复杂性要求","D":"强制密码历史"},"answer":"A","analysis":"设定密码长度最小值、密码必须符合复杂性要求、强制密码历史都是常见的本地用户组密码安全策略，用于增强密码安全性；设定用户不能更改密码不属于通用的密码安全策略内容。所以选 A。","source":"未提供","difficulty":"中"},{"id":"choice-261","type":"choice","globalNumber":261,"stem":"下列保护系统账户安全的措施中，(　　) 措施对解决口令暴力破解无帮助。","options":{"A":"使用屏幕保护并设置返回时需要提供口令","B":"设置系统的账户锁定策略，在用户登录输入错误次数达到一定数量时对账户进行锁定","C":"更改系统内宣管理员的用户名","D":"给管理员账户一个安全的口令"},"answer":"A","analysis":"使用屏幕保护并设置返回时需口令，主要是防止他人在设备使用间隙未经授权访问，无法阻止暴力破解；账户锁定策略可限制暴力破解尝试次数；更改管理员用户名和设置安全口令都有助于防范暴力破解","source":"网络安全基础","difficulty":"易"},{"id":"choice-262","type":"choice","globalNumber":262,"stem":"下列哪一种防病毒软件的实施策略在内部公司网络中是最有效的 (　　)。","options":{"A":"服务器防毒软件","B":"病毒墙","C":"工作站防病毒软件","D":"病毒库及时更新"},"answer":"D","analysis":"病毒库及时更新能让防病毒软件识别最新病毒，无论服务器、工作站还是通过病毒墙防护，及时更新病毒库是有效防范病毒的关键，其他选项单独实施效果有限","source":"网络安全基础","difficulty":"易"},{"id":"choice-263","type":"choice","globalNumber":263,"stem":"假设使用一种加密算法，它的加密方法很简单：将每一个字母加 5，即加密成 f，这种算法的密钥就是 5，那么它属于 (　　)。","options":{"A":"对称加密技术","B":"分组密码技术","C":"公钥加密技术","D":"单向函数密码技术"},"an ":"choice-278","type":"choice","globalNumber":278,"stem":"要删除思科路由器上的用户配置内容，可以使用 (　　) 命令。","options":{"A":"Router#del startup-config","B":"Router#erase startup-config","C":"Router#remove startup-config","D":"Router#write startup-config"},"answer":"B","analysis":"erase startup-config 命令用于删除思科路由器的启动配置文件（保存用户配置内容）；del 在思科设备中不是删除配置文件的标准命令；remove 也不是；write startup-config 是保存配置","source":"思科路由器配置","difficulty":"易"},{"id":"choice-279","type":"choice","globalNumber":279,"stem":"小张在 Windows 系统中的 “本地安全策略” 中，配置了四类安全策略：账号策略、本地策略、公钥策略和 IP 安全策略，那么该操作属于操作系统安全配置内容中的 (　　)。","options":{"A":"关闭不必要的端口","B":"关闭不必要的服务","C":"查看日志记录","D":"制定安全策略"},"answer":"D","analysis":"在 “本地安全策略” 中配置各类策略属于制定安全策略；A、B、C 选项与题干描述的配置安全策略操作不符","source":"Windows 系统安全配置","difficulty":"易"},{"id":"choice-280","type":"choice","globalNumber":280,"stem":"在工作组中，每台计算机把自己的资源信息、用户账户信息和安全信息存放在本地的 (　　) 中。","options":{"A":"活动目录数据库","B":"防火墙","C":"文件夹","D":"SAM 数据库"},"answer":"D","analysis":"在工作组环境下，计算机的资源、用户账户和安全信息存储在本地安全账户管理器（SAM）数据库中；活动目录数据库用于域环境；防火墙用于网络安全防护；文件夹用于存储文件，不存储这些信息","source":"Windows 系统基础","difficulty":"易"},{"id":"choice-281","type":"choice","globalNumber":281,"stem":"共享文件夹权限只对用户通过 (　　) 访问这个文件夹时起到约束作用，如果用户在这个文件夹所在的计算机上以交互式方式访问它时，则不会受到共享文件夹权限的限制。","options":{"A":"计算机","B":"路由器","C":"网络","D":"远程访问服务器"},"answer":"C","analysis":"共享文件夹权限主要针对网络访问进行约束，在本地交互式访问时不受限，所以选 C。","source":"未提及","difficulty":"基础"},{"id":"choice-282","type":"choice","globalNumber":282,"stem":"操作系统漏洞分类，从作用范围角度可以分为 (　　)。","options":{"A":"主动触发漏洞","B":"本地漏洞","C":"内存漏洞","D":"逻辑漏洞"},"answer":"B","analysis":"从作用范围角度，操作系统漏洞可分为本地漏洞等，A 是按触发方式分类，C、D 是从其他技术角度分类，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-283","type":"choice","globalNumber":283,"stem":"服务器的不同作用，针对不同的安全级别进行分级管理补丁，以下说法错误的是 (　　)。","options":{"A":"内网服务器的风险级别稍低，补丁修复的宽容度可以高一些，允许部分蓝屏或反复重启的服务器带漏洞运行","B":"边界服务服务器的风险级别较高，必须要严格对待，不能修复漏洞的无论如何也不允许上线","C":"边界服务服务器在补丁修复时蓝屏或反复重启的问题不能解决时，只能临时不进行补丁更新","D":"边界服务服务器不能修复漏洞的无论如何也不允许上线"},"answer":"C","analysis":"边界服务服务器若补丁修复出现蓝屏或反复重启问题不能解决时，应积极寻找其他解决方 首次提交申请或原备案号被注销后重新提交，B 是变更接入商备案，C 是新增备案，D 是修改备案信息，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-291","type":"choice","globalNumber":291,"stem":"网络管理是对网络设备及应用加以规划、监控和管理，并进行跟踪、记录、分析网络的异常情况，使网络管理人员能及时处理问题，网络管理具备以下几大功能：配置管理、(　　)、性能管理、安全管理和计费管理等。","options":{"A":"故障管理","B":"日常备份管理","C":"升级管理","D":"发送邮件"},"answer":"A","analysis":"网络管理的基本功能包括配置管理、故障管理、性能管理、安全管理和计费管理，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-292","type":"choice","globalNumber":292,"stem":"常用的数据备份方式包括完全备份、增量备份和差异备份，3 种方式在数据存储的空间利用率方面由多到少的顺序为 (　　)。","options":{"A":"完全备份、增量备份、差异备份","B":"完全备份、差异备份、增量备份","C":"增量备份、差异备份、完全备份","D":"差异备份、增量备份、完全备份"},"answer":"C","analysis":"增量备份只备份上次备份后新增或修改的数据，差异备份备份上次完全备份后变化的数据，完全备份备份全部数据，所以空间利用率由多到少是增量备份、差异备份、完全备份，选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-293","type":"choice","globalNumber":293,"stem":"以下关于灾难恢复和数据备份的理解，说法相对正确的是 (　　)。","options":{"A":"增量备份是备份从上次完全备份后更新的全部数据文件","B":"依据具备的灾难恢复资源程度的不同，灾难恢复能力分为 7 个等级","C":"数据备份按数据类型划分为系统数据备份和用户数据备份","D":"如果系统在一段时间内没有出现问题，就可以不用再进行容灾演练了"},"answer":"C","analysis":"增量备份是备份上次备份（完全或增量）后更新的数据，不是上次完全备份后全部更新数据，A 错误；灾难恢复能力分 6 个等级，B 错误；容灾演练需定期进行，D 错误；数据备份按数据类型可分为系统数据备份和用户数据备份，C 正确 。","source":"未提及","difficulty":"中等"},{"id":"choice-294","type":"choice","globalNumber":294,"stem":"在以下选项中，不是 IP SAN 的特点是 (　　)。","options":{"A":"设备整合，多台服务器可以通过存储网络同时访问后端存储系统，不必为每台服务器单独购买存储设备，降低存储设备异构化程度，减轻维护工作量，降低维护费用","B":"数据集中，不同应用和服务器的数据实现了物理上的集中，空间调整和数据复制等工作可以在一台设备上完成，大大提高了存储资源利用率","C":"兼容性好，FC 协议经过长期发展，已经形成大规模产品化，而且厂商之间均遵循统一的标准，以使目前 FC SAN 成为了主流的存储架构","D":"高扩展性，存储网络架构使得服务器可以方便的接入现有 SAN 环境，较好的适应应用变化的需求"},"answer":"C","analysis":"C 选项描述的是 FC SAN 的特点，不是 IP SAN 的特点，IP SAN 具有设备整合、数据集中、高扩展性等特点，所以选 C。","source":"未提及","difficulty":"中等"},{"id":"choice-295","type":"choice","globalNumber":295,"stem":"SNMP 的中文含义是 (　　)。","options":{"A":"简单网络管理协议","B":"简单邮件传送协议","C":"简单公用管理信息协议","D":"简单文件传输协议"},"answer":"A","analysis":"SNMP 的中文含义是简单网络管理协议，简单邮件传送协议是 SMTP，简单文件传输协议是 TFTP，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-296","type":"choice","globalNumber":296,"stem":"以下哪些属于系统的物理故障 (　　)。","options":{"A":"硬件故障与软件故障","B":"计算机病毒","C":"人为的失误","D":"网络故障和设备环境故障"},"answer":"A","analysis":"系统物理故障包括硬件故障与软件故障，计算机病毒属于软件问题但不是物理故障，人为失误不属于物理故障范畴，网络故障和设备环境故障不全面，所以选 A。","source":"未提及","difficulty":"基础"},{"id":"choice-297","type":"choice","globalNumber":297,"stem":"以下哪个是测试网线的工具 (　　)。","options":{"A":"数字电压表","B":"网络测试仪","C":"时域反射仪","D":"电缆检测其"},"answer":"B","analysis":"网络测试仪可用于测试网线，数字电压表用于测量电压，时域反射仪主要用于检测电缆故障位置等，D 选项表述不规范，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-298","type":"choice","globalNumber":298,"stem":"查看系统开放端口的命令是 (　　)。","options":{"A":"nslookup","B":"netstat -an","C":"net use","D":"net share"},"answer":"B","analysis":"netstat -an 命令可用于查看系统开放端口，nslookup 用于域名查询，net use 用于连接网络资源等，net share 用于管理共享资源，所以选 B。","source":"未提及","difficulty":"基础"},{"id":"choice-299","type":"choice","globalNumber":299,"stem":"网络故障按照结构化故障排除的方法，依次处理的顺序是 (　　)。①分析信息；②测试假设；③消除原因；④收集信息；⑤提出假设。","options":{"A":"①②③④⑤","B":"④⑤②①③","C":"⑤④①②③","D":"④①⑤②③"},"answer":"D","analysis":"网络故障结构化排除方法依次是收集信息、分析信息、提出假设、测试假设、消除原因，所以选 D。","source":"未提及","difficulty":"中等"},{"id":"choice-300","type":"choice","globalNumber":300,"stem":"由非预期的、不正常的程序结束所造成的故障是 (　　)。","options":{"A":"系统故障","B":"网络故障","C":"事务故障","D":"介质故障"},"answer":"C","analysis":"事务故障通常由非预期的、不正常的程序结束造成，系统故障涉及系统层面更广泛问题，网络故障主要是网络连接等问题，介质故障与存储介质相关，所以选 C。","source":"未提及","difficulty":"中等"}]</script>
<script>
const PAGE_CONFIG = {"pageId": "choice_251-300", "type": "choice", "prevUrl": "choice_201-250.html", "nextUrl": "choice_301-350.html"};
const QUESTIONS = JSON.parse(document.getElementById('question-data').textContent);

const STORAGE_KEY = 'quiz_progress_v1';
const PROGRESS_VERSION = 1;
const PAGE_LIST = [
  'choice_1-50.html','choice_51-100.html','choice_101-150.html','choice_151-200.html',
  'choice_201-250.html','choice_251-300.html','choice_301-350.html','choice_351-400.html',
  'judgment_1-50.html','judgment_51-100.html'
];

let state = {
  version: PROGRESS_VERSION,
  answers: {},
  results: {},
  currentId: null,
  currentPage: PAGE_CONFIG.pageId
};

function getAnswer(id) { return state.answers[id] || null; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return;
    state.answers = parsed.answers && typeof parsed.answers === 'object' ? parsed.answers : {};
    state.results = parsed.results && typeof parsed.results === 'object' ? parsed.results : {};
    state.currentId = parsed.currentId || null;
    state.currentPage = parsed.currentPage || PAGE_CONFIG.pageId;
  } catch (e) {
    console.warn('loadState failed', e);
  }
}

function saveState() {
  try {
    state.version = PROGRESS_VERSION;
    state.currentPage = PAGE_CONFIG.pageId;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('saveState failed', e);
  }
}

function isCorrect(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return null;
  const a = getAnswer(id);
  if (a == null) return null;
  return a === q.answer;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderQuestions() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';

  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    if (state.currentId === q.id) card.classList.add('current');
    card.dataset.id = q.id;

    const header = document.createElement('div');
    header.className = 'question-header';
    header.textContent = q.type === 'choice'
      ? `选择题 第${q.globalNumber}题`
      : `判断题 第${q.globalNumber}题`;

    const stem = document.createElement('div');
    stem.className = 'question-stem';
    stem.textContent = q.stem;

    const optionsBox = document.createElement('div');
    optionsBox.className = 'options';

    const userAnswer = getAnswer(q.id);
    const answered = userAnswer != null;
    const isUserCorrect = answered && userAnswer === q.answer;
    if (answered) optionsBox.classList.add('locked');

    Object.keys(q.options).forEach(key => {
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.dataset.key = key;
      opt.textContent = q.type === 'choice'
        ? `${key}. ${q.options[key]}`
        : q.options[key];

      if (answered) {
        if (key === q.answer) {
          opt.classList.add('correct');
        } else if (!isUserCorrect) {
          opt.classList.add('wrong');
        }
      }

      opt.addEventListener('click', () => selectOption(q.id, key));
      optionsBox.appendChild(opt);
    });

    card.appendChild(header);
    card.appendChild(stem);
    card.appendChild(optionsBox);
    area.appendChild(card);
  });
}

function selectOption(questionId, key) {
  if (getAnswer(questionId) != null) return;
  const q = QUESTIONS.find(x => x.id === questionId);
  if (!q) return;

  const correct = key === q.answer;
  state.answers[questionId] = key;
  state.results[questionId] = {
    answer: key,
    isCorrect: correct,
    analysisVisible: true,
    locked: true
  };
  state.currentId = questionId;
  saveState();

  const card = document.querySelector(`.question-card[data-id="${CSS.escape(questionId)}"]`);
  if (card) {
    card.classList.add('current');
    const optionsBox = card.querySelector('.options');
    optionsBox.classList.add('locked');
    optionsBox.querySelectorAll('.option').forEach(opt => {
      opt.classList.remove('correct', 'wrong');
      if (opt.dataset.key === q.answer) {
        opt.classList.add('correct');
      } else if (!correct) {
        opt.classList.add('wrong');
      }
    });
  }

  renderNumberList();
  showAnalysis(questionId);
}

function renderNumberList() {
  const list = document.getElementById('numberList');
  list.innerHTML = '';

  QUESTIONS.forEach(q => {
    const item = document.createElement('div');
    item.className = 'num-item';
    item.dataset.id = q.id;
    item.textContent = q.type === 'choice'
      ? `选${q.globalNumber}`
      : `判${q.globalNumber}`;

    const correct = isCorrect(q.id);
    if (correct === true) item.classList.add('correct');
    else if (correct === false) item.classList.add('wrong');

    if (state.currentId === q.id) item.classList.add('current');

    item.addEventListener('click', () => goToQuestion(q.id));
    list.appendChild(item);
  });
}

function goToQuestion(id) {
  const card = document.querySelector(`.question-card[data-id="${CSS.escape(id)}"]`);
  if (!card) return;

  document.querySelectorAll('.question-card.current').forEach(el => el.classList.remove('current'));
  card.classList.add('current');
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  state.currentId = id;
  renderNumberList();

  if (getAnswer(id) != null) showAnalysis(id);
  else clearAnalysis();

  saveState();
}

function showAnalysis(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return;
  const a = getAnswer(id);
  if (a == null) { clearAnalysis(); return; }

  const correct = a === q.answer;
  const box = document.getElementById('analysis');
  box.innerHTML = `
    <div class="my-answer ${correct ? 'correct' : 'wrong'}">
      我的答案：${escapeHtml(a)}
    </div>
    <div class="analysis-line">解析：${escapeHtml(q.analysis)}</div>
    <div class="analysis-line meta">来源：${escapeHtml(q.source || '未提供')}</div>
    <div class="analysis-line meta">难度：${escapeHtml(q.difficulty || '未提供')}</div>
  `;
  if (state.results[id]) state.results[id].analysisVisible = true;
}

function clearAnalysis() {
  document.getElementById('analysis').innerHTML = '';
}

function updateNavButton(el, url) {
  if (!el) return;
  if (!url) {
    el.classList.add('disabled');
    el.removeAttribute('href');
    el.setAttribute('aria-disabled', 'true');
  } else {
    el.classList.remove('disabled');
    el.setAttribute('href', url);
    el.removeAttribute('aria-disabled');
  }
}

function setupNav() {
  updateNavButton(document.getElementById('prevBtn'), PAGE_CONFIG.prevUrl);
  updateNavButton(document.getElementById('nextBtn'), PAGE_CONFIG.nextUrl);
  updateNavButton(document.getElementById('prevBtnM'), PAGE_CONFIG.prevUrl);
  updateNavButton(document.getElementById('nextBtnM'), PAGE_CONFIG.nextUrl);
}

function setupToggle() {
  const panel = document.getElementById('infoPanel');
  const btn = document.getElementById('toggleBtn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    panel.classList.toggle('expanded');
    btn.textContent = panel.classList.contains('expanded') ? '收起' : '展开';
  });
}

function setupScrollSpy() {
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const cards = document.querySelectorAll('.question-card');
      let best = null, bestDist = Infinity;
      cards.forEach(c => {
        const r = c.getBoundingClientRect();
        const dist = Math.abs(r.top - 80);
        if (dist < bestDist) { bestDist = dist; best = c; }
      });
      if (best && state.currentId !== best.dataset.id) {
        state.currentId = best.dataset.id;
        document.querySelectorAll('.question-card.current').forEach(el => el.classList.remove('current'));
        best.classList.add('current');
        renderNumberList();
        saveState();
      }
      ticking = false;
    });
  });
}

function buildProgressForExport() {
  const copy = {
    version: PROGRESS_VERSION,
    exportedAt: new Date().toISOString(),
    answers: state.answers,
    results: state.results,
    currentId: state.currentId,
    currentPage: state.currentPage || PAGE_CONFIG.pageId
  };
  return copy;
}

function downloadProgress() {
  const json = JSON.stringify(buildProgressForExport(), null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'quiz_progress.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function openProgressModal(mode) {
  const modal = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const note = document.getElementById('modalNote');
  const text = document.getElementById('modalTextarea');
  const confirmBtn = document.getElementById('modalConfirm');
  const downloadBtn = document.getElementById('modalDownload');
  modal.classList.add('show');

  if (mode === 'export') {
    title.textContent = '导出进度';
    note.textContent = '下面是完整 JSON，可复制，也可以直接下载 quiz_progress.json。';
    text.value = JSON.stringify(buildProgressForExport(), null, 2);
    text.readOnly = true;
    confirmBtn.textContent = '复制';
    confirmBtn.dataset.mode = 'export';
    downloadBtn.style.display = 'inline-flex';
  } else {
    title.textContent = '导入进度';
    note.textContent = '粘贴之前导出的 JSON，点击“导入并恢复”。导入会覆盖当前刷题进度。';
    text.value = '';
    text.readOnly = false;
    confirmBtn.textContent = '导入并恢复';
    confirmBtn.dataset.mode = 'import';
    downloadBtn.style.display = 'none';
  }
}

function closeProgressModal() {
  document.getElementById('modal').classList.remove('show');
}

function restoreImportedState(parsed) {
  if (!parsed || typeof parsed !== 'object' || !parsed.answers || typeof parsed.answers !== 'object') {
    throw new Error('JSON 格式不正确');
  }
  const importedPage = PAGE_LIST.includes(parsed.currentPage) ? parsed.currentPage : PAGE_CONFIG.pageId;

  state = {
    version: PROGRESS_VERSION,
    answers: parsed.answers || {},
    results: parsed.results && typeof parsed.results === 'object' ? parsed.results : {},
    currentId: parsed.currentId || null,
    currentPage: importedPage
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

  if (importedPage !== PAGE_CONFIG.pageId) {
    location.href = importedPage;
    return;
  }

  renderQuestions();
  renderNumberList();
  clearAnalysis();
  if (state.currentId && QUESTIONS.some(q => q.id === state.currentId)) {
    const card = document.querySelector(`.question-card[data-id="${CSS.escape(state.currentId)}"]`);
    if (card) card.scrollIntoView({ behavior: 'auto', block: 'start' });
    if (getAnswer(state.currentId) != null) showAnalysis(state.currentId);
  }
  closeProgressModal();
}

function setupProgressButtons() {
  const modal = document.getElementById('modal');
  const text = document.getElementById('modalTextarea');
  const confirmBtn = document.getElementById('modalConfirm');
  const closeBtn = document.getElementById('modalClose');
  const downloadBtn = document.getElementById('modalDownload');

  document.getElementById('exportBtn').addEventListener('click', () => openProgressModal('export'));
  document.getElementById('importBtn').addEventListener('click', () => openProgressModal('import'));

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (confirm('确定清空全部刷题进度？此操作不可恢复。')) {
      localStorage.removeItem(STORAGE_KEY);
      state = { version: PROGRESS_VERSION, answers: {}, results: {}, currentId: null, currentPage: PAGE_CONFIG.pageId };
      renderQuestions();
      renderNumberList();
      clearAnalysis();
    }
  });

  closeBtn.addEventListener('click', closeProgressModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeProgressModal();
  });

  confirmBtn.addEventListener('click', async () => {
    const mode = confirmBtn.dataset.mode;
    if (mode === 'export') {
      text.select();
      try {
        await navigator.clipboard.writeText(text.value);
      } catch (e) {
        document.execCommand('copy');
      }
      confirmBtn.textContent = '已复制';
      setTimeout(() => { confirmBtn.textContent = '复制'; }, 1200);
    } else if (mode === 'import') {
      try {
        const parsed = JSON.parse(text.value);
        if (!confirm('导入将覆盖当前进度，确定继续？')) return;
        restoreImportedState(parsed);
      } catch (e) {
        alert('导入失败：' + e.message);
      }
    }
  });

  downloadBtn.addEventListener('click', downloadProgress);
}

function init() {
  loadState();
  renderQuestions();
  renderNumberList();
  setupNav();
  setupToggle();
  setupScrollSpy();
  setupProgressButtons();

  if (state.currentPage !== PAGE_CONFIG.pageId && PAGE_LIST.includes(state.currentPage)) {
    // A state from another page should not cause a surprise navigation when opened manually;
    // the index page handles "continue". The imported-state handler redirects immediately.
    state.currentPage = PAGE_CONFIG.pageId;
    saveState();
  }

  if (state.currentId && QUESTIONS.some(q => q.id === state.currentId)) {
    const card = document.querySelector(`.question-card[data-id="${CSS.escape(state.currentId)}"]`);
    if (card) card.scrollIntoView({ behavior: 'auto', block: 'start' });
    if (getAnswer(state.currentId) != null) showAnalysis(state.currentId);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
